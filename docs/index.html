<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f1e8">
<title>B2 Ready for Teachers · หลักสูตรเตรียมสอบ B2 สำหรับครู</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f1e8; --card:#fffdf8; --ink:#1b2a23; --muted:#5f6d65; --line:#e4ddcd;
  --green:#1f5a44; --green-2:#2c7457; --green-soft:#e3eee7;
  --gold:#d99a2b; --gold-soft:#f7ead0;
  --bad:#b8452c; --bad-soft:#f8e2db;
  --r:16px; --r-sm:10px;
  --shadow:0 1px 0 rgba(27,42,35,.04),0 6px 20px -12px rgba(27,42,35,.25);
  --f-body:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --f-head:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-read:"Literata",Georgia,serif;
  --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
body{min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--f-head);line-height:1.25;margin:0;text-wrap:balance}
p{margin:0 0 .8em;text-wrap:pretty}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px)}

/* top bar */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:12px 16px;background:rgba(245,241,232,.94);backdrop-filter:saturate(1.2) blur(6px);border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top .ttl{flex:1;font-family:var(--f-head);font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-head);font-weight:700;font-size:17px;flex:1}
.brand b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--green);color:#fff;font-size:13px;letter-spacing:.02em}
.ibtn{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;border-radius:12px}
.ibtn:active{background:var(--line)}
.ibtn svg{width:22px;height:22px}

.view{padding:8px 16px 0;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--muted);font-weight:500}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--green)}
.nav button.on svg{stroke-width:2.2}

/* type helpers */
.eyebrow{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
.sec{margin:26px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec h2{font-size:19px}
.sec a,.link{color:var(--green);font-weight:600;font-size:14px;text-decoration:none;background:none;border:0;padding:0}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card + .card{margin-top:12px}
.stack>*+*{margin-top:12px}

/* hero (home) */
.hero{background:var(--green);color:#f3f1e9;border-radius:20px;padding:20px 20px 18px;position:relative;overflow:hidden}
.hero .hi{font-size:15px;opacity:.85}
.hero h1{font-size:24px;margin:2px 0 14px;color:#fff}
.hero .goal{display:flex;align-items:flex-end;gap:14px}
.hero .lvl{font-family:var(--f-head);font-weight:700;font-size:56px;line-height:.9;color:var(--gold);letter-spacing:-.02em}
.hero .goal p{margin:0;font-size:13.5px;opacity:.9;line-height:1.45}
.hero .bar{margin-top:16px;height:8px;background:rgba(255,255,255,.16);border-radius:99px;overflow:hidden}
.hero .bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .6s ease}
.hero .meta{display:flex;justify-content:space-between;font-size:13px;margin-top:6px;opacity:.9}
.hero .grid-lines{position:absolute;right:-30px;top:-30px;width:180px;height:180px;border-radius:50%;border:1px solid rgba(255,255,255,.09);box-shadow:0 0 0 22px rgba(255,255,255,.03),0 0 0 44px rgba(255,255,255,.025)}

.continue{display:flex;align-items:center;gap:14px;margin-top:14px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.continue .n{font-family:var(--f-head);font-weight:700;font-size:22px;width:46px;height:46px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--gold-soft);color:#8a5a0c}
.continue .tx{flex:1;min-width:0}
.continue .tx b{display:block;font-family:var(--f-head);font-size:16px}
.continue .tx span{font-size:13.5px;color:var(--muted)}
.continue svg{width:22px;height:22px;color:var(--green)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{font-family:var(--f-head);font-size:22px;display:block;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}

/* list rows */
.rows{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;border:0;background:none;text-align:left;border-bottom:1px solid var(--line);min-height:60px}
.row:last-child{border-bottom:0}
.row:active{background:var(--paper)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:600}
.row .tx span{display:block;font-size:13.5px;color:var(--muted)}
.row .chev{width:18px;height:18px;color:var(--muted);flex:none}
.dot{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.dot.ok{background:var(--green);border-color:var(--green);color:#fff}
.dot.ok svg{width:16px;height:16px}
.dot.part{border-color:var(--gold);color:#8a5a0c;background:var(--gold-soft)}

/* unit cards */
.unit{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.unit + .unit{margin-top:10px}
.unit .head{display:flex;gap:14px;align-items:flex-start}
.unit .no{font-family:var(--f-head);font-weight:700;font-size:28px;line-height:1;color:var(--green);width:34px;flex:none}
.unit h3{font-size:17px}
.unit .th{font-size:14px;color:var(--muted)}
.unit .focus{display:inline-block;margin-top:8px;font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--green-soft);color:var(--green);font-weight:600}
.unit .pbar{margin-top:12px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.unit .pbar i{display:block;height:100%;background:var(--green-2)}
.unit.done .no{color:var(--gold)}

/* unit page header */
.uhead{padding:6px 0 4px}
.uhead .eyebrow{color:var(--green)}
.uhead h1{font-size:26px;margin:2px 0 2px}
.uhead p{color:var(--muted);margin:0}

/* buttons */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid transparent;font-weight:600;font-size:15.5px;background:var(--green);color:#fff;width:100%}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.gold{background:var(--gold);color:#2b1d03}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:20px;height:20px}
.btns{display:grid;gap:10px;margin-top:18px}
.btns.two{grid-template-columns:1fr 1fr}

.chip{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}

/* vocab */
.vocab{display:flex;gap:12px;align-items:flex-start}
.vocab .tx{flex:1}
.vocab .w{font-family:var(--f-head);font-weight:600;font-size:19px}
.vocab .p{font-size:13px;color:var(--muted);margin-left:6px;font-style:italic}
.vocab .t{display:block;margin:2px 0 6px}
.vocab .ex{font-family:var(--f-read);font-size:15px;color:#36463e;line-height:1.5}
.say{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--green)}
.say svg{width:20px;height:20px}
.say.playing{background:var(--green);color:#fff;border-color:var(--green)}

/* grammar */
.rule h3{font-size:16.5px;margin-bottom:6px}
.formula{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:13.5px;background:var(--green-soft);color:var(--green);padding:8px 12px;border-radius:8px;margin:0 0 10px;line-height:1.5}
.ex-line{display:flex;align-items:center;gap:8px;font-family:var(--f-read);font-size:15.5px;padding:4px 0}
.ex-line .say{width:34px;height:34px}
.ex-line .say svg{width:16px;height:16px}
.tips{margin:0;padding:0;list-style:none}
.tips li{padding:8px 0 8px 26px;position:relative;font-size:15px;border-bottom:1px dashed var(--line)}
.tips li:last-child{border-bottom:0}
.tips li::before{content:"";position:absolute;left:4px;top:16px;width:8px;height:8px;border-radius:50%;background:var(--gold)}

/* reading */
.passage{font-family:var(--f-read);font-size:17px;line-height:1.75;color:#22322a}
.passage p{margin:0 0 1em}
.passage.collapsed{max-height:160px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent)}

/* listening player */
.player{display:flex;align-items:center;gap:14px}
.play{width:64px;height:64px;border-radius:50%;border:0;background:var(--green);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 8px 20px -8px rgba(31,90,68,.6)}
.play svg{width:28px;height:28px}
.play.playing{background:var(--gold);color:#2b1d03}
.player .tx{flex:1}
.player .tx b{display:block;font-family:var(--f-head)}
.script{white-space:pre-wrap;font-family:var(--f-read);font-size:15.5px;line-height:1.7;background:var(--paper);border-radius:10px;padding:12px 14px;margin-top:12px}

/* questions */
.q{padding:4px 0}
.q + .q{border-top:1px solid var(--line);padding-top:16px;margin-top:12px}
.q .qt{font-weight:600;margin-bottom:10px}
.q .qt i{font-style:normal;color:var(--muted);font-weight:500;margin-right:4px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:15.5px;line-height:1.4}
.opt .k{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--paper);color:var(--muted)}
.opt.sel{border-color:var(--ink)}
.opt.sel .k{background:var(--ink);color:#fff}
.opt.right{border-color:var(--green-2);background:var(--green-soft)}
.opt.right .k{background:var(--green-2);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.explain{margin-top:10px;font-size:14.5px;padding:10px 12px;border-radius:10px;background:var(--paper);color:#38473f}
.explain b{color:var(--green)}
#view > .explain{background:var(--card);border:1px solid var(--line)}
.fc .bw{font-family:var(--f-head);font-weight:600;color:var(--green);margin-bottom:6px}
.explain.no b{color:var(--bad)}

/* runner */
.runner-top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.runner-top .track{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.runner-top .track i{display:block;height:100%;background:var(--green);transition:width .3s}
.runner-top span{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.ctx{margin-bottom:14px}
.ctx summary{cursor:pointer;font-weight:600;color:var(--green);padding:6px 0;list-style:none}
.ctx summary::-webkit-details-marker{display:none}
.qbig{font-family:var(--f-head);font-size:20px;font-weight:600;line-height:1.4;margin:6px 0 16px}

/* result */
.result{text-align:center;padding:26px 16px}
.score-ring{width:150px;height:150px;margin:0 auto 12px;position:relative}
.score-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.score-ring .v{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-head)}
.score-ring .v b{font-size:38px;line-height:1}
.score-ring .v span{font-size:13px;color:var(--muted);display:block}
.badge{display:inline-block;padding:4px 14px;border-radius:99px;font-weight:700;font-family:var(--f-head);font-size:15px}
.badge.b2{background:var(--green);color:#fff}
.badge.b1{background:var(--gold-soft);color:#8a5a0c}
.badge.a2{background:var(--bad-soft);color:var(--bad)}
.breakdown{display:grid;gap:8px;margin-top:16px;text-align:left}
.breakdown .ln{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:10px;font-size:14px}
.breakdown .ln .t{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.breakdown .ln .t i{display:block;height:100%;background:var(--green-2)}

/* flashcards */
.fc-wrap{perspective:1200px;margin:6px 0 16px}
.fc{position:relative;height:300px;transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.fc .back{transform:rotateY(180deg);background:#fbf7ee}
.fc .w{font-family:var(--f-head);font-weight:700;font-size:34px;line-height:1.15}
.fc .p{color:var(--muted);font-style:italic;margin-top:4px}
.fc .hint{position:absolute;bottom:14px;font-size:12.5px;color:var(--muted)}
.fc .t{font-size:21px;font-weight:600;margin-bottom:12px}
.fc .ex{font-family:var(--f-read);font-size:16px;color:#36463e}
.fc .unit-tag{position:absolute;top:14px;left:16px;font-size:12px;color:var(--muted)}
.fc .say{position:absolute;top:10px;right:10px}
@media (prefers-reduced-motion:reduce){.fc{transition:none}}

/* textarea */
textarea,input[type=text],input[type=date],select{width:100%;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);color:var(--ink)}
textarea{min-height:220px;resize:vertical;font-family:var(--f-read);line-height:1.6}
textarea:focus,input:focus,select:focus{outline:2px solid var(--green-2);outline-offset:1px;border-color:transparent}
label.lb{display:block;font-weight:600;font-size:14.5px;margin:14px 0 6px}
.wc{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);margin-top:6px}

/* info page */
.table{width:100%;border-collapse:collapse;font-size:15px}
.table th,.table td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.table th{white-space:nowrap;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.table td b{font-family:var(--f-head)}
.timeline{list-style:none;margin:0;padding:0;counter-reset:s}
.timeline li{position:relative;padding:0 0 16px 40px;counter-increment:s}
.timeline li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.timeline li::after{content:"";position:absolute;left:13.5px;top:30px;bottom:2px;width:1px;background:var(--line)}
.timeline li:last-child::after{display:none}
.timeline b{display:block}
.note{font-size:13.5px;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin-top:14px}
.big-compare{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center;margin:6px 0 4px}
.big-compare b{font-family:var(--f-head);font-size:40px;line-height:1;display:block}
.big-compare .from b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px}
.big-compare .to b{color:var(--green)}
.big-compare span{font-size:13px;color:var(--muted)}
.big-compare svg{width:28px;height:28px;color:var(--gold)}

/* plan */
details.plan summary{list-style:none;cursor:pointer}
details.plan summary::-webkit-details-marker{display:none}
.plan-list{margin-top:10px}
.plan-list .pl{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.plan-list .pl .wk{font-family:var(--f-head);font-weight:700;color:var(--green);font-size:13px;line-height:1.2}
.plan-list .pl .wk small{display:block;font-size:20px}
.plan-list .pl b{font-size:15px;display:block}
.plan-list .pl span{font-size:13.5px;color:var(--muted)}
.plan-list .pl.now{background:var(--gold-soft);margin:0 -16px;padding:10px 16px}

/* onboarding */
.onb{padding:28px 4px 0}
.onb h1{font-size:30px;margin:10px 0 8px}
.onb .lead{font-size:16px;color:var(--muted)}
.seg{display:grid;gap:8px}
.seg button{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);min-height:56px}
.seg button.on{border-color:var(--green);background:var(--green-soft)}
.seg button b{font-family:var(--f-head);font-size:18px;width:36px;color:var(--green)}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.empty{text-align:center;padding:36px 12px}
.empty h2{font-size:21px;margin-bottom:6px}
.center{text-align:center}
.mt{margin-top:16px}
.hide{display:none!important}

@media (min-width:600px){
  .app{padding-top:12px}
  .view{padding:8px 20px 0}
}

/* ── v2: exam prep & speaking ── */
.feature{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:20px;padding:18px;background:var(--ink);color:#f3efe4;box-shadow:var(--shadow)}
.feature .ft-tx{flex:1}.feature b{display:block;font-family:var(--f-head);font-size:19px;margin:2px 0 3px;color:#fff}
.feature .ft-tx>span:last-child{font-size:13.5px;opacity:.85}
.ft-mic{width:56px;height:56px;border-radius:50%;background:var(--gold);color:#2b1d03;display:grid;place-items:center;flex:none}
.ft-mic svg{width:28px;height:28px}
.xgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.xcard{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.xcard .xn{font-family:var(--f-head);font-weight:700;font-size:22px;color:var(--green)}
.xcard .xs{font-size:13px;color:var(--muted);margin-bottom:10px}
.xcard .pbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:6px}
.xcard .pbar i{display:block;height:100%;background:var(--gold)}
.b2chip{display:inline-block;vertical-align:middle;font-size:13px;font-family:var(--f-body);font-weight:600;padding:3px 10px;border-radius:99px;background:var(--gold-soft);color:#8a5a0c;margin-left:6px}
.say.sm{width:34px;height:34px;margin-right:8px;vertical-align:middle}
.say.sm svg{width:16px;height:16px}
.q .qt{display:flex;align-items:center;flex-wrap:wrap}
.opt:not(:has(.k)){padding-left:16px}
input.gap{margin-top:2px}
input.gap.right,.cz-in.right{border-color:var(--green-2);background:var(--green-soft)}
input.gap.wrong,.cz-in.wrong{border-color:var(--bad);background:var(--bad-soft)}
.cloze{line-height:2.3}
.cz{white-space:nowrap}
.cz-in{font:inherit;font-size:16px;padding:0 3px;height:30px;border:0;border-bottom:2px solid var(--green-2);background:var(--green-soft);border-radius:4px 4px 0 0;color:var(--ink);letter-spacing:.05em}
.cz-in:focus{outline:2px solid var(--gold)}
.fix{color:var(--green);font-weight:700;font-size:12px;margin-left:2px}
.bd .bubble{display:flex;align-items:center;gap:10px;font-family:var(--f-read);font-size:16px;background:var(--paper);border-radius:14px 14px 14px 4px;padding:8px 12px;margin-bottom:10px}
.bd .bubble .say{width:34px;height:34px}.bd .bubble .say svg{width:16px;height:16px}
.slot{min-height:52px;border:1.5px dashed var(--line);border-radius:12px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:6px}
.tok{font-family:var(--f-read);font-size:15.5px;min-height:40px}
.slot .tok{background:var(--ink);color:#fff;border-color:var(--ink)}
.bd.ok .slot{border-color:var(--green-2);background:var(--green-soft)}
.bd.no .slot{border-color:var(--bad);background:var(--bad-soft)}
.chart{margin-top:14px;background:var(--paper);border-radius:12px;padding:10px}
.chart svg{width:100%;height:auto;display:block}
.posts{display:grid;gap:8px;margin-top:12px}
.post{background:var(--paper);border-radius:12px;padding:10px 12px;font-size:14.5px}
.post p{margin:4px 0 0;font-family:var(--f-read)}
.post.prof{background:var(--green-soft)}
.phr{display:flex;flex-wrap:wrap;gap:6px}
.phr .chip{font-size:13px;min-height:32px;white-space:normal;text-align:left}
.lvchip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--gold-soft);color:#8a5a0c}
.lvl-big{font-family:var(--f-head);font-weight:700;font-size:72px;line-height:1;color:var(--green);margin-bottom:6px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.kv span{color:var(--muted)}.kv b{text-align:right}
.switch{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14.5px;min-height:44px}
.switch input{width:22px;height:22px;accent-color:var(--green)}
.warnbox{background:var(--gold-soft);border:1px solid #ecd3a1;color:#5b4210}
.warnbox a{color:var(--green);font-weight:600;word-break:break-all}
.cue{background:var(--card);border:1px solid var(--line);border-left:0;border-radius:16px;padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.cue::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--gold)}
.cue h2{font-family:var(--f-read);font-weight:500;font-size:20px;margin-top:4px}
.cue ul{margin:4px 0 0;padding-left:20px;font-family:var(--f-read);font-size:15.5px}
.notes-ro{white-space:pre-wrap;font-size:14px;background:var(--paper);border-radius:10px;padding:8px 12px;margin-top:10px;color:var(--muted)}
.stagebox{display:grid;place-items:center;padding:18px 0 6px}
.tring{width:180px;height:180px;position:relative}
.tring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tring .arc{stroke:var(--green-2);transition:stroke-dashoffset .2s linear}
.tring.rec .arc{stroke:var(--bad)}
.tring.warn .arc{stroke:var(--gold)}
.tring .tv{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.tring .tv b{font-family:var(--f-head);font-size:40px;line-height:1;display:block;font-variant-numeric:tabular-nums}
.tring .tv span{font-size:13px;color:var(--muted)}
.recbar{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-weight:600;font-size:14px}
.recbar.off{background:var(--paper);color:var(--muted);font-weight:500}
.rdot{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.meter{flex:1;height:6px;background:rgba(184,69,44,.15);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;width:100%;background:var(--bad);transform-origin:left;transform:scaleX(.03);transition:transform .08s}
.examiner{display:flex;gap:12px;align-items:flex-start;margin-top:12px}
.examiner .av{width:44px;height:44px;flex:none;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
.examiner .av svg{width:22px;height:22px}
.examiner .qtext{flex:1;background:var(--card);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:12px 14px;font-family:var(--f-read);font-size:18px;line-height:1.5;box-shadow:var(--shadow);min-height:52px}
.qprog{display:flex;gap:6px;margin:8px 0 2px}
.qprog i{flex:1;height:5px;border-radius:99px;background:var(--line)}
.qprog i.d{background:var(--green-2)}.qprog i.c{background:var(--gold)}
.checks .ck{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.checks .ck:last-of-type{border-bottom:0}
.checks input{width:22px;height:22px;margin-top:2px;accent-color:var(--green);flex:none}
.phr-grid{display:grid;gap:12px;margin-top:10px}
.phr-grid .ph{font-family:var(--f-read);font-size:15px;padding:3px 0}
.recitem .ri-h{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.recitem b{display:block;font-family:var(--f-read);font-weight:500;line-height:1.35;margin:2px 0}
.del{color:var(--muted)}.del.armed{color:#fff;background:var(--bad)}
.nav-in{grid-template-columns:repeat(5,1fr)}

.xcard.wide{grid-column:span 2;background:var(--green-soft);border-color:#cfe0d6}
.skill4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.skill4 div{background:var(--paper);border-radius:12px;padding:10px 4px;text-align:center}
.skill4 b{display:block;color:var(--bad);font-family:var(--f-head);font-size:15px}
.skill4 span{font-size:12px;color:var(--muted)}
.table td:last-child{white-space:nowrap}

</style>

<script>
/* B2 Ready for Teachers — course content
   q: question, o: options (o[a] is correct; options are shuffled at runtime), e: Thai explanation */
window.COURSE = {
  units: [
    /* ───────────────────────── UNIT 1 ───────────────────────── */
    {
      id: 'u1', no: 1,
      title: 'Classroom Life', th: 'ชีวิตในห้องเรียน',
      focus: 'Present Perfect vs Past Simple',
      vocab: [
        { w: 'engage', p: 'v.', t: 'ดึงให้มีส่วนร่วม / ดึงความสนใจ', ex: 'Group tasks help engage quieter students.' },
        { w: 'curriculum', p: 'n.', t: 'หลักสูตร', ex: 'The new curriculum focuses on active learning.' },
        { w: 'differentiate', p: 'v.', t: 'จัดการเรียนรู้ให้เหมาะกับผู้เรียนแต่ละระดับ', ex: 'Good teachers differentiate tasks for mixed-ability classes.' },
        { w: 'objective', p: 'n.', t: 'จุดประสงค์การเรียนรู้', ex: 'I always share the lesson objective at the start.' },
        { w: 'disruptive', p: 'adj.', t: 'ที่ก่อความวุ่นวาย', ex: 'Disruptive behaviour often means that a student is bored.' },
        { w: 'encourage', p: 'v.', t: 'ส่งเสริม / ให้กำลังใจ', ex: 'We encourage students to ask questions.' },
        { w: 'attendance', p: 'n.', t: 'การเข้าเรียน', ex: 'Attendance has improved since we started the breakfast club.' },
        { w: 'routine', p: 'n.', t: 'กิจวัตร / ขั้นตอนที่ทำเป็นประจำ', ex: 'A clear routine saves time at the start of each lesson.' }
      ],
      grammar: {
        title: 'Present Perfect vs Past Simple',
        intro: 'ระดับ B2 ต้องแยกให้ออกว่าเหตุการณ์ "จบไปแล้วในอดีตที่ระบุเวลา" หรือ "เชื่อมโยงกับปัจจุบัน" ข้อสอบชอบหลอกด้วยคำบอกเวลา',
        rules: [
          { h: 'Past Simple — จบแล้ว ระบุเวลาในอดีต', f: 'S + V2  (yesterday, last year, in 2020, ago)', ex: ['I taught at a primary school in 2018.', 'We introduced the new curriculum last semester.'] },
          { h: 'Present Perfect — มีผลถึงปัจจุบัน / ประสบการณ์', f: 'S + have/has + V3  (since, for, already, yet, ever, never)', ex: ['I have worked here since 2019.', 'Have you ever taken an online course?'] },
          { h: 'Present Perfect Continuous — เน้นความต่อเนื่อง', f: 'S + have/has been + V-ing', ex: ['The students are tired because they have been studying all morning.'] }
        ],
        tips: ['ถ้ามีคำบอกเวลาในอดีตที่ชัดเจน (last week, ago, in 2020) → ใช้ Past Simple เท่านั้น', 'since + จุดเริ่มต้นของเวลา (since 2019) / for + ช่วงเวลา (for five years)', 'ผิดบ่อย: ✗ I have visited Chiang Mai last year. → ✓ I visited Chiang Mai last year.']
      },
      reading: {
        title: 'The Five-Minute Start',
        text: `Many teachers lose the first ten minutes of a lesson. Students arrive late, bags are unpacked slowly, and the noise level rises before any learning has begun. At Ban Nong Khai School, a group of teachers decided to try a simple solution: a "five-minute start". As soon as students enter the room, they find a short task on the board, such as a vocabulary puzzle or a question about the previous lesson. They work on it silently while the teacher takes attendance.

Since the routine was introduced last year, teachers have noticed fewer disruptive moments at the beginning of lessons. "The students know exactly what to do, so I don't need to raise my voice," explains Ms Pranee, who teaches science. However, she admits that the tasks must be carefully planned. If they are too difficult, weaker students give up; if they are too easy, students finish in a minute and start chatting. The key, she says, is to differentiate: she now prepares two versions of each task.`,
        qs: [
          { q: 'What problem were the teachers trying to solve?', o: ['Time being wasted at the start of lessons', 'Students failing their science exams', 'A lack of vocabulary materials', 'Teachers arriving late to class'], a: 0, e: 'ย่อหน้าแรก: "Many teachers lose the first ten minutes of a lesson."' },
          { q: 'What does the teacher do while students work on the task?', o: ['Takes attendance', 'Writes the next task', 'Talks to weaker students', 'Marks homework'], a: 0, e: '"They work on it silently while the teacher takes attendance."' },
          { q: 'Why does Ms Pranee prepare two versions of each task?', o: ['To suit students of different abilities', 'To use them in two different classes', 'Because the first version is often wrong', 'To give students homework'], a: 0, e: 'งานยากไปเด็กอ่อนท้อ ง่ายไปเด็กเก่งคุย จึงต้อง differentiate' }
        ]
      },
      listening: {
        title: 'A Colleague Asks About Your New Class',
        script: `A: How was your first week with the new class?
B: Better than I expected, actually. I've already learned all their names, which helps a lot.
A: That's great. Have you had any problems with behaviour?
B: Only on Monday. Two boys at the back kept talking, so I moved them to the front. Since then, they've been fine.
A: Smart move. Are you using the group work activities we discussed?
B: Not yet. I want to establish the routine first. I'll probably start next week.`,
        qs: [
          { q: 'What did speaker B do about the two boys?', o: ['Moved them to the front', 'Sent them to the head teacher', 'Called their parents', 'Put them in a group'], a: 0, e: '"so I moved them to the front"' },
          { q: 'When will speaker B probably start group work?', o: ['Next week', 'Tomorrow', 'On Monday', 'Next semester'], a: 0, e: '"I\'ll probably start next week."' }
        ]
      },
      writing: {
        prompt: 'A new colleague is starting at your school next week. Write an email (120–150 words) giving advice about managing a class in the first week.',
        tips: ['ขึ้นต้น/ลงท้ายอีเมลให้ถูกต้อง (Hi … / Best wishes,)', 'ให้คำแนะนำ 2–3 ข้อ พร้อมเหตุผล', 'ใช้ Present Perfect อย่างน้อย 1 ครั้ง เช่น I have found that…', 'ใช้คำเชื่อม: First of all, Also, Finally'],
        model: `Hi Nok,

Welcome to the team! I'm sure you'll enjoy working here. Since you asked for advice about your first week, here are a few ideas that have worked for me.

First of all, set up a clear routine from day one. I have found that students behave much better when they know exactly what to do as soon as they enter the room. Also, try to learn their names quickly – it shows you care and makes it easier to manage the class.

If a student is disruptive, stay calm and speak to them privately after the lesson rather than in front of everyone. Finally, don't try to do everything at once. Focus on building good relationships first; group work and projects can wait a week or two.

Let me know if you need anything!

Best wishes,
Dao`
      },
      quiz: [
        { q: 'I ___ at this school since 2019.', o: ['have worked', 'worked', 'am working', 'work'], a: 0, e: 'since 2019 → Present Perfect' },
        { q: 'We ___ the new curriculum last semester.', o: ['introduced', 'have introduced', 'introduce', 'have been introducing'], a: 0, e: 'last semester = เวลาในอดีตที่ระบุ → Past Simple' },
        { q: '___ you ever ___ an online course?', o: ['Have / taken', 'Did / took', 'Do / take', 'Has / took'], a: 0, e: 'ever = ประสบการณ์ → Have you ever + V3' },
        { q: 'The students look exhausted. They ___ for the exam all morning.', o: ['have been studying', 'studied', 'study', 'are studied'], a: 0, e: 'เน้นความต่อเนื่องที่ส่งผลถึงตอนนี้ → Present Perfect Continuous' },
        { q: 'A good teacher should ___ tasks for students with different abilities.', o: ['differentiate', 'disrupt', 'attend', 'object'], a: 0, e: 'differentiate = ปรับงานให้เหมาะกับผู้เรียนแต่ละระดับ' },
        { q: 'Students who are bored may become ___.', o: ['disruptive', 'encouraged', 'attended', 'curriculum'], a: 0, e: 'disruptive (adj.) = ก่อความวุ่นวาย' }
      ]

    /* ───────────────────────── UNIT 2 ───────────────────────── */
    {
      id: 'u2', no: 2,
      title: 'Talking to Parents', th: 'การสื่อสารกับผู้ปกครอง',
      focus: 'Polite language & Modals',
      vocab: [
        { w: 'concern', p: 'n.', t: 'ความกังวล / เรื่องที่น่าเป็นห่วง', ex: 'Thank you for raising your concern with me.' },
        { w: 'appreciate', p: 'v.', t: 'ซาบซึ้ง / ขอบคุณ', ex: 'I would appreciate it if you could sign the form.' },
        { w: 'progress', p: 'n.', t: 'ความก้าวหน้า', ex: 'Her progress in reading has been impressive.' },
        { w: 'arrange', p: 'v.', t: 'จัดเตรียม / นัดหมาย', ex: 'Could we arrange a meeting next week?' },
        { w: 'support', p: 'n./v.', t: 'การสนับสนุน / สนับสนุน', ex: 'We really need your support at home.' },
        { w: 'behaviour', p: 'n.', t: 'พฤติกรรม', ex: 'His behaviour in class has improved a lot.' },
        { w: 'regarding', p: 'prep.', t: 'เกี่ยวกับ', ex: 'I am writing regarding the school trip.' },
        { w: 'inform', p: 'v.', t: 'แจ้งให้ทราบ', ex: 'Please inform us if your child will be absent.' }
      ],
      grammar: {
        title: 'Polite Requests & Modals',
        intro: 'ภาษาสุภาพเป็นหัวใจของการสื่อสารแบบมืออาชีพ ข้อสอบ B2 มักถามว่า "ประโยคไหนสุภาพที่สุด" หรือให้เติมโครงสร้างที่ถูกต้อง',
        rules: [
          { h: 'ขอร้องอย่างสุภาพ', f: 'Could you + V1…? / Would you mind + V-ing…?', ex: ['Could you sign the form, please?', 'Would you mind checking her homework diary?'] },

        tips: ['Would you mind ตามด้วย V-ing เสมอ: ✗ Would you mind to check → ✓ Would you mind checking', 'ตอบ "Would you mind…?" ว่ายินดี = "Not at all." (ไม่รังเกียจเลย)', 'อีเมลทางการ: I am writing regarding / with regard to …']
      },

        title: 'An Email to Parents',

I am writing regarding Nida's progress in English this term. First of all, I would like to say how much I appreciate the support you have given her at home. Her reading has improved noticeably, and she now takes part in class discussions with much more confidence.

However, I have one small concern. Nida has not handed in three of her last five homework tasks. When I asked her about it, she said that she often forgets because she has extra classes in the evening. I completely understand that her schedule is busy, but homework is an important part of her assessment.

Would you mind checking her homework diary once a week? Alternatively, we could arrange a short meeting to find a solution together. I am available on Tuesday and Thursday afternoons.

Kind regards,
Ms Kanya Srisuk
English Department`,
        qs: [
          { q: 'What is the main purpose of the email?', o: ['To report progress and raise a concern about homework', 'To complain about Nida\'s behaviour', 'To invite parents to a school event', 'To explain a new assessment policy'], a: 0, e: 'ชมความก้าวหน้า + แจ้งเรื่องการบ้านที่ไม่ส่ง' },
          { q: 'Why does Nida often miss her homework?', o: ['She forgets because of evening extra classes', 'She finds it too difficult', 'She does not have a homework diary', 'She is often absent from school'], a: 0, e: '"she often forgets because she has extra classes in the evening"' },
          { q: 'What does the teacher suggest?', o: ['Checking the homework diary or meeting', 'Stopping her extra classes', 'Giving Nida less homework', 'Moving Nida to another class'], a: 0, e: '"Would you mind checking her homework diary… Alternatively, we could arrange a short meeting"' }
        ]
      },
      listening: {
        title: 'A Phone Call from a Parent',
        script: `A: Good afternoon, this is Mrs Malee, Ton's mother. I'm calling to inform you that Ton will be absent tomorrow.
B: Thank you for letting me know. Is he unwell?
A: No, he has a dental appointment in the morning. He might come to school after lunch, but I'm not sure.
B: That's fine. Could you ask him to check the class website? I'll upload the worksheet there.
A: Of course. Thank you so much.`,
        qs: [

      reading: {
        title: 'Feedback That Works',
        text: `Research consistently shows that feedback is one of the most powerful ways to improve learning, but not all feedback is equally useful. A grade on its own, such as "7/10", tells students how well they did, but not how to do better. If students only receive grades, they tend to compare themselves with classmates rather than focus on their own learning.

Effective feedback, on the other hand, is specific and forward-looking. Instead of writing "Good job", a teacher might write, "Your argument is clear. Next time, support it with an example from the text." Many teachers use a rubric so that students understand the criteria before they start a task.

Admittedly, exam results are objective and easy to compare. If a teacher's students consistently perform poorly, this may indicate that the teaching methods need to change. Results can also help school leaders identify which teachers might benefit from extra training or support.

However, relying mainly on exam scores ignores the many factors outside a teacher's control. Students from disadvantaged backgrounds often start the year far behind their peers, so a teacher who helps them make great progress may still have lower results than a colleague teaching high achievers. For example, in many rural Thai schools, students may lack internet access or support at home, yet their teachers work extremely hard.

One explanation is that people read faster on screens, often skimming rather than reading carefully. Many readers are also overconfident: they believe they have understood a digital text well, but their test results show otherwise. In addition, physical books give readers a sense of where information is located – near the beginning, in the middle or at the end – which may help them remember it.

  cards: [
    { topic: 'Describe a teacher who has influenced you.', points: ['who this teacher was', 'when and where they taught you', 'what they were like', 'and explain how they influenced you'],
      p3: ['What qualities make a good teacher?', 'Is teaching more difficult today than in the past? Why?', 'Should teachers be paid more than other professionals?'],
      model: `I'd like to talk about my high school English teacher, Mrs Sunee. She taught me when I was in Grade 10 at a provincial school in Lampang. To be honest, before her class, English was my least favourite subject, because I found grammar really boring. But Mrs Sunee was different. She was patient, funny, and she always brought English songs and short stories into class. What I remember most is that she never laughed at our mistakes; instead, she encouraged us to keep trying. She influenced me in two ways. First, she made me fall in love with English, which is why I chose to study it at university. Second, she showed me what kind of teacher I wanted to be. Even now, when a student is struggling in my class, I ask myself, "What would Mrs Sunee do?"` },

      p3: ['What skills are most important for young people today?', 'Is it better to learn skills from a teacher or online?', 'Do adults find it harder to learn new skills than children?'],
      model: `A skill I would really like to learn is video editing. These days, many of my students learn from short videos, and I think if I could make my own lesson videos, my teaching would be much more engaging. I'd probably start by taking an online course, because there are lots of free tutorials, and then I'd practise by making short clips for my classes. I think it would take me around three months to become fairly confident, as long as I practised a little every day. The main reason I want to learn it is to connect better with my students, but I also think it would be a lot of fun. I could even use it to make videos of family trips, which my parents would definitely appreciate.` },
    { topic: 'Describe a time when you helped someone.', points: ['who you helped', 'what the situation was', 'how you helped them', 'and explain how you felt about it'],

    { topic: 'Describe a memorable lesson you taught or attended.', points: ['what the lesson was about', 'who was there', 'what happened', 'and explain why it was memorable'],

      model: `The lesson I want to talk about is one I taught about two years ago to a Grade 11 class. The topic was "giving directions", which is usually quite boring. So, instead of using the textbook, I took the students outside and gave each group a map of the school with a secret "treasure" hidden somewhere. They had to give each other directions in English to find it. At first, they were shy, but within ten minutes everyone was shouting directions and laughing. It was memorable for me because even the quietest students joined in. A few weeks later, one of them told me it was the first time she had ever enjoyed speaking English. That lesson taught me that students learn best when they're active and having fun.` },

      model: `A book I really enjoyed is "Wonder" by R. J. Palacio. I read it about three years ago, after a colleague recommended it for our school reading programme. It's about a boy called Auggie who was born with a facial difference and goes to a regular school for the first time. The story is told from the point of view of several characters, including Auggie, his sister and his classmates. I enjoyed it for two reasons. First, the language is simple, so it's perfect for English learners, but the message is deep. Second, it made me think about kindness and how students treat each other. After reading it, I actually used some chapters in my class, and it led to some really meaningful discussions about bullying.` },

    { topic: 'Describe a time when you had to make an important decision.', points: ['what the decision was', 'when you made it', 'what options you had', 'and explain how you felt about the decision'],

    { topic: 'Describe an event that you helped to organise.', points: ['what the event was', 'who attended it', 'what you did to organise it', 'and explain how successful it was'],

    { topic: 'Describe a goal you hope to achieve in the future.', points: ['what the goal is', 'when you hope to achieve it', 'what you are doing to achieve it', 'and explain why this goal is important to you'],

    { topic: 'Describe a person you admire who helps the community.', points: ['who this person is', 'what they do', 'how you know them', 'and explain why you admire them'],

    { topic: 'Describe a time when you received good news.', points: ['what the news was', 'when and how you received it', 'who you shared it with', 'and explain how you felt'],

      stage('<div class="examiner"><span class="av">' + I.user + '</span><div class="qtext">' + esc(intro) + '</div></div>' + recBar(recOK));
      return speakP(intro, run).then(one).then(function () { if (!run.dead) { beep(520, 300); return speakP('Thank you. That is the end of the speaking test.', run); } });
    }

    function eduFlow(c, recOK) {
      var i = 0, n = c.qs.length;
      function one() {
        if (run.dead || i >= n) return Promise.resolve();
        var q = c.qs[i];
        stage('<div class="eyebrow">Question ' + (i + 1) + ' of ' + n + '</div><div class="qprog">' + c.qs.map(function (_, k) { return '<i class="' + (k < i ? 'd' : k === i ? 'c' : '') + '"></i>'; }).join('') + '</div>' +
          '<div class="cue"><div class="eyebrow">' + (i === 0 ? 'Personal experience' : 'Opinion') + '</div><h2>' + esc(q) + '</h2></div>' +
          '<div id="rb"><div class="recbar off"><span>เตรียมตัว — คิดโครง: จุดยืน/เหตุการณ์ → เหตุผล → ตัวอย่าง</span></div></div>' +
          '<div class="stagebox" id="tb"></div><div class="btns"><button class="btn ghost" id="skip">พร้อมแล้ว เริ่มพูด</button></div>');
        $('#skip').onclick = function () { run.skip(); };
        return speakP(q, run).then(function () {
          if (run.dead) return;
          return countdown($('#tb'), f.prep, 'เวลาเตรียม', run);
        }).then(function () {
          if (run.dead) return;
          beep(880, 150);
          var ok = run.rec && !run.rec.failed && run.rec.resume();
          $('#rb').innerHTML = recBar(!!ok);
          if (ok) run.rec.meter($('#mt'));
          var sk = $('#skip'); sk.textContent = i < n - 1 ? 'พูดจบแล้ว ข้อต่อไป' : 'พูดจบแล้ว';
          return countdown($('#tb'), f.perQ, 'เวลาพูด', run, { rec: !!ok, warn: 10 });
        }).then(function () {
          if (run.rec) run.rec.pause();
          beep(520, 200); i++;
          return wait(400).then(one);
        });
      }
      var intro = 'In this section, you will answer three questions. For each question, you will have fifteen seconds to prepare and forty-five seconds to speak.';
      stage('<div class="examiner"><span class="av">' + I.user + '</span><div class="qtext">' + esc(intro) + '</div></div>');
      return speakP(intro, run).then(one);
    }

    function repeatFlow(c, recOK) {
      var i = 0;
      function one() {
        if (run.dead || i >= c.reps.length) return Promise.resolve();
        var t = c.reps[i], secs = Math.min(14, Math.max(6, Math.round(3 + A.words(t) * 0.7)));
        stage('<div class="eyebrow">Listen and Repeat</div><div class="qprog">' + c.reps.map(function (_, k) { return '<i class="' + (k < i ? 'd' : k === i ? 'c' : '') + '"></i>'; }).join('') + '</div>' +
          '<div class="examiner"><span class="av">' + I.spk + '</span><div class="qtext" id="qt"><span class="muted">ฟังประโยคที่ ' + (i + 1) + '/' + c.reps.length + '…</span></div></div>' + recBar(recOK) + '<div class="stagebox" id="tb"></div><div class="btns"><button class="btn ghost" id="skip">พูดจบแล้ว</button></div>');
        $('#skip').onclick = function () { run.skip(); };
        if (run.rec) run.rec.meter($('#mt'));
        var listen = run.voice ? speakP(t, Object.assign({}, run, { voice: true })) : Promise.resolve($('#qt').textContent = t);
        return Promise.resolve(listen).then(function () {
          if (run.dead) return;
          if (run.rec && !run.rec.mr && !run.rec.failed) run.rec.start();
          var qt = $('#qt'); if (qt) qt.innerHTML = '<b>พูดตามเลย</b>';
          beep(880, 150);
          return countdown($('#tb'), secs, 'พูดตาม', run, { rec: recOK });
        }).then(function () { i++; return wait(300).then(one); });
      }
      stage('<div class="examiner"><span class="av">' + I.user + '</span><div class="qtext">You will hear seven sentences. After each one, repeat it exactly as you heard it.</div></div>');
      return speakP('You will hear seven sentences. After each one, repeat it exactly as you heard it.', run).then(one);
    }

    function review(c, audio) {
      var id = Date.now(), checks = {}, recObj = null;
      var items = c.qs || c.reps || null;
      if (audio && audio.blob && audio.blob.size) {
        recObj = { id: id, ts: id, f: f.id, title: c.title, items: items, points: c.points || null, dur: audio.dur, mime: audio.blob.type, blob: audio.blob, checks: checks };
        DB.put(recObj).catch(function () { A.toast('บันทึกลงคลังไม่ได้ (พื้นที่เบราว์เซอร์)'); });
      }
      var S = A.S; S.spCount = (S.spCount || 0) + 1;
      if (M4 && S.m4cur) { S.m4cur.s = { id: recObj ? recObj.id : null, checks: checks, done: true }; S.m4cur.stage = 'writing'; }
      A.touch();
      var url = recObj ? URL.createObjectURL(audio.blob) : null;
      if (url) A.leave.push(function () { URL.revokeObjectURL(url); });
      var ext = recObj ? (/mp4|aac/.test(recObj.mime) ? 'm4a' : /ogg/.test(recObj.mime) ? 'ogg' : 'webm') : '';
      el.innerHTML = '<div class="uhead"><div class="eyebrow">ผลการฝึก · ' + esc(f.exam) + ' ' + esc(f.name) + '</div><h1>ฟังเสียงตัวเอง</h1><p>' + esc(c.title) + '</p></div>' +
        (url ? '<div class="card mt"><audio controls preload="metadata" src="' + url + '" style="width:100%"></audio><div class="kv" style="margin-top:8px"><span>ความยาว</span><b>' + mmss(audio.dur) + ' นาที</b></div><div class="btns two" style="margin-top:10px"><a class="btn ghost" href="' + url + '" download="speaking-' + f.id + '-' + A.ds(new Date()) + '.' + ext + '">ดาวน์โหลด</a><button class="btn ghost" id="rv-lib">คลังเสียง</button></div><p class="small muted" style="margin:8px 0 0">บันทึกในคลังเสียงของเครื่องนี้แล้ว</p></div>'
          : '<div class="note warnbox">รอบนี้ไม่ได้บันทึกเสียง (ไม่มีสิทธิ์ไมโครโฟน หรือเปิดจาก Apps Script)' + (IN_GAS ? '<br><a href="' + ALT_URL + '" target="_blank" rel="noopener">เปิดเวอร์ชันที่บันทึกเสียงได้ ↗</a>' : '') + '</div>') +
        (c.reps ? '<div class="sec"><h2>ประโยคต้นฉบับ</h2><span class="small muted">เทียบกับเสียงของคุณ</span></div><div class="card">' + c.reps.map(function (t, i) { return '<div class="ex-line">' + A.sayBtn(t) + '<span><b>' + (i + 1) + '.</b> ' + esc(t) + '</span></div>'; }).join('') + '</div>' : '') +
        (c.qs ? '<div class="sec"><h2>คำถามในรอบนี้</h2></div><div class="card">' + c.qs.map(function (q, i) { return '<div class="ex-line">' + A.sayBtn(q) + '<span><b>' + (i + 1) + '.</b> ' + esc(q) + '</span></div>'; }).join('') + '</div>' : '') +
        (M4 ? '<div class="note">ข้อสอบจำลอง 4 ทักษะ · ส่วนที่ 3/4 เสร็จแล้ว — ฟังเสียงตัวเอง แล้วติ๊กเกณฑ์ที่ทำได้ ผลจะนำไปคำนวณระดับ Speaking</div>' : '') +
        (!c.reps ? '<div class="sec"><h2>ประเมินตัวเอง</h2><span class="small muted">ฟังเสียงแล้วติ๊ก</span></div><div class="card checks">' + SP.criteria.map(function (cr) { return '<label class="ck"><input type="checkbox" data-k="' + cr.k + '"><span><b>' + esc(cr.name) + '</b><br><span class="small muted">' + esc(cr.th) + '</span></span></label>'; }).join('') + '<div class="small" id="ck-sum" style="margin-top:8px"></div></div>' : '') +
        (c.model ? '<details class="card mt"><summary class="link" style="list-style:none;cursor:pointer">ดูตัวอย่างคำตอบระดับ B2+</summary><div style="display:flex;justify-content:flex-end;margin:8px 0">' + A.sayBtn(c.model) + '</div><div class="passage" style="font-size:15.5px">' + A.paras(c.model) + '</div></details>' : '') +
        '<details class="card mt"><summary class="link" style="list-style:none;cursor:pointer">สำนวนช่วยพูด (useful phrases)</summary><div class="phr-grid">' +
        [['เริ่มตอบ', 'start'], ['ให้เหตุผล', 'reason'], ['ยกตัวอย่าง', 'example'], ['ซื้อเวลาคิด', 'time'], ['สรุป', 'end']].map(function (g) { return '<div><div class="small muted">' + g[0] + '</div>' + SP.phrases[g[1]].map(function (p) { return '<div class="ph">' + esc(p) + '</div>'; }).join('') + '</div>'; }).join('') + '</div></details>' +
        (M4 ? '<div class="btns"><button class="btn gold" id="rv-m4">ไปส่วนสุดท้าย: Writing →</button></div>' :
        '<div class="btns">' + (f.id === 'ielts2' ? '<button class="btn gold" id="rv-p3">ต่อ Part 3 (หัวข้อเดียวกัน)</button>' : '') + '<button class="btn" id="rv-new">สุ่มหัวข้อใหม่</button><button class="btn ghost" id="rv-same">ลองหัวข้อเดิมอีกครั้ง</button></div>');
      $$('.checks input', el).forEach(function (b) {
        b.onchange = function () {
          checks[b.dataset.k] = b.checked;
          var n = Object.keys(checks).filter(function (k) { return checks[k]; }).length;
          $('#ck-sum').innerHTML = 'ผ่าน <b>' + n + '/5</b> เกณฑ์ ' + (n >= 4 ? '— พร้อมระดับ B2 แล้ว' : n >= 2 ? '— ใกล้แล้ว ฝึกซ้ำหัวข้อเดิมอีกรอบ' : '— ลองฟังตัวอย่างคำตอบและใช้สำนวนช่วยพูด');
          if (recObj) { recObj.checks = checks; DB.put(recObj).catch(function () { }); }
          if (M4 && A.S.m4cur) { A.S.m4cur.s.checks = checks; A.save(); }
        };
      });
      var lib = $('#rv-lib'); if (lib) lib.onclick = function () { A.go('recs'); };
      var p3 = $('#rv-p3'); if (p3) p3.onclick = function () { A.go('speakrun', { f: 'ielts3', card: c.card, from: A.R.from }); };
      var m4b = $('#rv-m4'); if (m4b) { m4b.onclick = function () { A.S.m4cur.stage = 'writing'; A.save(); A.go('m4'); }; return; }
      $('#rv-new').onclick = function () { A.go('speakrun', { f: f.id, from: A.R.from }); };
      $('#rv-same').onclick = function () {
        if (c.card != null) A.go('speakrun', { f: f.id, card: c.card, from: A.R.from });
        else A.go('speakrun', { f: f.id, from: A.R.from, same: { title: c.title, qs: c.qs, reps: c.reps } });
      };
    }
    if (A.R.same) $$('.kv b', el)[2].textContent = 'เดิม: ' + A.R.same.title;
  };

  /* ── library ── */
  V.recs = function (el) {
    A.top({ back: function () { A.go('speak'); }, title: 'คลังเสียงของฉัน' });
    el.innerHTML = '<div class="uhead"><div class="eyebrow">My recordings</div><h1>คลังเสียงของฉัน</h1><p>ฟังย้อนหลังเพื่อเทียบพัฒนาการ ไฟล์เก็บในเบราว์เซอร์ของเครื่องนี้เท่านั้น</p></div><div id="rl" class="mt"><p class="muted">กำลังโหลด…</p></div>';
    var urls = []; A.leave.push(function () { urls.forEach(function (u) { URL.revokeObjectURL(u); }); });
    DB.all().then(function (all) {
      var box = $('#rl'); if (!box) return;
      all.sort(function (a, b) { return b.ts - a.ts; });
      if (!all.length) { box.innerHTML = '<div class="empty"><h2>ยังไม่มีไฟล์เสียง</h2><p class="muted">เริ่มฝึกพูดแล้วเสียงจะถูกเก็บไว้ที่นี่</p><div class="btns"><button class="btn" id="rl-go">ไปฝึกพูด</button></div></div>'; $('#rl-go').onclick = function () { A.go('speak'); }; return; }
      box.innerHTML = all.map(function (r) {
        var u = URL.createObjectURL(r.blob); urls.push(u);
        var f = fmt(r.f) || { exam: '', name: r.f }, n = r.checks ? Object.keys(r.checks).filter(function (k) { return r.checks[k]; }).length : 0;
        return '<div class="card recitem" data-id="' + r.id + '"><div class="ri-h"><div><div class="eyebrow">' + esc(f.exam + ' · ' + f.name) + '</div><b>' + esc(r.title) + '</b><div class="small muted">' + new Date(r.ts).toLocaleString('th-TH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + ' · ' + mmss(r.dur) + (n ? ' · ประเมินตัวเอง ' + n + '/5' : '') + '</div></div><button class="ibtn del" aria-label="ลบ">' + I.trash + '</button></div><audio controls preload="none" src="' + u + '" style="width:100%;margin-top:8px"></audio></div>';
      }).join('') + '<p class="small muted center">' + all.length + ' ไฟล์</p>';
      $$('.del', box).forEach(function (b) {
        var armed = false;
        b.onclick = function () {
          if (!armed) { armed = true; b.classList.add('armed'); A.toast('แตะอีกครั้งเพื่อลบ'); setTimeout(function () { armed = false; b.classList.remove('armed'); }, 2500); return; }
          var card = b.closest('.recitem'); DB.del(+card.dataset.id).then(function () { card.remove(); A.toast('ลบแล้ว'); });
        };
      });
    }, function () { var box = $('#rl'); if (box) box.innerHTML = '<div class="note warnbox">เบราว์เซอร์นี้ไม่อนุญาตให้เก็บไฟล์เสียง (เช่น โหมดไม่ระบุตัวตน)</div>'; });
  };
})();

;APP.start();

</script>
