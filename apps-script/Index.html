<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f1e8">
<title>B2 Ready for Teachers · หลักสูตรเตรียมสอบ B2 สำหรับครู</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f1e8; --card:#fffdf8; --ink:#1b2a23; --muted:#5f6d65; --line:#e4ddcd;
  --green:#1f5a44; --green-2:#2c7457; --green-soft:#e3eee7;
  --gold:#d99a2b; --gold-soft:#f7ead0;
  --bad:#b8452c; --bad-soft:#f8e2db;
  --r:16px; --r-sm:10px;
  --shadow:0 1px 0 rgba(27,42,35,.04),0 6px 20px -12px rgba(27,42,35,.25);
  --f-body:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --f-head:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-read:"Literata",Georgia,serif;
  --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
body{min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--f-head);line-height:1.25;margin:0;text-wrap:balance}
p{margin:0 0 .8em;text-wrap:pretty}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px)}

/* top bar */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:12px 16px;background:rgba(245,241,232,.94);backdrop-filter:saturate(1.2) blur(6px);border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top .ttl{flex:1;font-family:var(--f-head);font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-head);font-weight:700;font-size:17px;flex:1}
.brand b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--green);color:#fff;font-size:13px;letter-spacing:.02em}
.ibtn{width:44px;height:44px;display:grid;place-items:center;border:0;background:transparent;border-radius:12px}
.ibtn:active{background:var(--line)}
.ibtn svg{width:22px;height:22px}

.view{padding:8px 16px 0;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--muted);font-weight:500}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--green)}
.nav button.on svg{stroke-width:2.2}

/* type helpers */
.eyebrow{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
.sec{margin:26px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec h2{font-size:19px}
.sec a,.link{color:var(--green);font-weight:600;font-size:14px;text-decoration:none;background:none;border:0;padding:0}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card + .card{margin-top:12px}
.stack>*+*{margin-top:12px}

/* hero (home) */
.hero{background:var(--green);color:#f3f1e9;border-radius:20px;padding:20px 20px 18px;position:relative;overflow:hidden}
.hero .hi{font-size:15px;opacity:.85}
.hero h1{font-size:24px;margin:2px 0 14px;color:#fff}
.hero .goal{display:flex;align-items:flex-end;gap:14px}
.hero .lvl{font-family:var(--f-head);font-weight:700;font-size:56px;line-height:.9;color:var(--gold);letter-spacing:-.02em}
.hero .goal p{margin:0;font-size:13.5px;opacity:.9;line-height:1.45}
.hero .bar{margin-top:16px;height:8px;background:rgba(255,255,255,.16);border-radius:99px;overflow:hidden}
.hero .bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .6s ease}
.hero .meta{display:flex;justify-content:space-between;font-size:13px;margin-top:6px;opacity:.9}
.hero .grid-lines{position:absolute;right:-30px;top:-30px;width:180px;height:180px;border-radius:50%;border:1px solid rgba(255,255,255,.09);box-shadow:0 0 0 22px rgba(255,255,255,.03),0 0 0 44px rgba(255,255,255,.025)}

.continue{display:flex;align-items:center;gap:14px;margin-top:14px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.continue .n{font-family:var(--f-head);font-weight:700;font-size:22px;width:46px;height:46px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--gold-soft);color:#8a5a0c}
.continue .tx{flex:1;min-width:0}
.continue .tx b{display:block;font-family:var(--f-head);font-size:16px}
.continue .tx span{font-size:13.5px;color:var(--muted)}
.continue svg{width:22px;height:22px;color:var(--green)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{font-family:var(--f-head);font-size:22px;display:block;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}

/* list rows */
.rows{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;border:0;background:none;text-align:left;border-bottom:1px solid var(--line);min-height:60px}
.row:last-child{border-bottom:0}
.row:active{background:var(--paper)}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:600}
.row .tx span{display:block;font-size:13.5px;color:var(--muted)}
.row .chev{width:18px;height:18px;color:var(--muted);flex:none}
.dot{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.dot.ok{background:var(--green);border-color:var(--green);color:#fff}
.dot.ok svg{width:16px;height:16px}
.dot.part{border-color:var(--gold);color:#8a5a0c;background:var(--gold-soft)}

/* unit cards */
.unit{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.unit + .unit{margin-top:10px}
.unit .head{display:flex;gap:14px;align-items:flex-start}
.unit .no{font-family:var(--f-head);font-weight:700;font-size:28px;line-height:1;color:var(--green);width:34px;flex:none}
.unit h3{font-size:17px}
.unit .th{font-size:14px;color:var(--muted)}
.unit .focus{display:inline-block;margin-top:8px;font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--green-soft);color:var(--green);font-weight:600}
.unit .pbar{margin-top:12px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.unit .pbar i{display:block;height:100%;background:var(--green-2)}
.unit.done .no{color:var(--gold)}

/* unit page header */
.uhead{padding:6px 0 4px}
.uhead .eyebrow{color:var(--green)}
.uhead h1{font-size:26px;margin:2px 0 2px}
.uhead p{color:var(--muted);margin:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid transparent;font-weight:600;font-size:15.5px;background:var(--green);color:#fff;width:100%}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.gold{background:var(--gold);color:#2b1d03}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:20px;height:20px}
.btns{display:grid;gap:10px;margin-top:18px}
.btns.two{grid-template-columns:1fr 1fr}

.chip{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}

/* vocab */
.vocab{display:flex;gap:12px;align-items:flex-start}
.vocab .tx{flex:1}
.vocab .w{font-family:var(--f-head);font-weight:600;font-size:19px}
.vocab .p{font-size:13px;color:var(--muted);margin-left:6px;font-style:italic}
.vocab .t{display:block;margin:2px 0 6px}
.vocab .ex{font-family:var(--f-read);font-size:15px;color:#36463e;line-height:1.5}
.say{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--green)}
.say svg{width:20px;height:20px}
.say.playing{background:var(--green);color:#fff;border-color:var(--green)}

/* grammar */
.rule h3{font-size:16.5px;margin-bottom:6px}
.formula{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:13.5px;background:var(--green-soft);color:var(--green);padding:8px 12px;border-radius:8px;margin:0 0 10px;line-height:1.5}
.ex-line{display:flex;align-items:center;gap:8px;font-family:var(--f-read);font-size:15.5px;padding:4px 0}
.ex-line .say{width:34px;height:34px}
.ex-line .say svg{width:16px;height:16px}
.tips{margin:0;padding:0;list-style:none}
.tips li{padding:8px 0 8px 26px;position:relative;font-size:15px;border-bottom:1px dashed var(--line)}
.tips li:last-child{border-bottom:0}
.tips li::before{content:"";position:absolute;left:4px;top:16px;width:8px;height:8px;border-radius:50%;background:var(--gold)}

/* reading */
.passage{font-family:var(--f-read);font-size:17px;line-height:1.75;color:#22322a}
.passage p{margin:0 0 1em}
.passage.collapsed{max-height:160px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent)}

/* listening player */
.player{display:flex;align-items:center;gap:14px}
.play{width:64px;height:64px;border-radius:50%;border:0;background:var(--green);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 8px 20px -8px rgba(31,90,68,.6)}
.play svg{width:28px;height:28px}
.play.playing{background:var(--gold);color:#2b1d03}
.player .tx{flex:1}
.player .tx b{display:block;font-family:var(--f-head)}
.script{white-space:pre-wrap;font-family:var(--f-read);font-size:15.5px;line-height:1.7;background:var(--paper);border-radius:10px;padding:12px 14px;margin-top:12px}

/* questions */
.q{padding:4px 0}
.q + .q{border-top:1px solid var(--line);padding-top:16px;margin-top:12px}
.q .qt{font-weight:600;margin-bottom:10px}
.q .qt i{font-style:normal;color:var(--muted);font-weight:500;margin-right:4px}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:15.5px;line-height:1.4}
.opt .k{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--paper);color:var(--muted)}
.opt.sel{border-color:var(--ink)}
.opt.sel .k{background:var(--ink);color:#fff}
.opt.right{border-color:var(--green-2);background:var(--green-soft)}
.opt.right .k{background:var(--green-2);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.explain{margin-top:10px;font-size:14.5px;padding:10px 12px;border-radius:10px;background:var(--paper);color:#38473f}
.explain b{color:var(--green)}
#view > .explain{background:var(--card);border:1px solid var(--line)}
.fc .bw{font-family:var(--f-head);font-weight:600;color:var(--green);margin-bottom:6px}
.explain.no b{color:var(--bad)}

/* runner */
.runner-top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.runner-top .track{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.runner-top .track i{display:block;height:100%;background:var(--green);transition:width .3s}
.runner-top span{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.ctx{margin-bottom:14px}
.ctx summary{cursor:pointer;font-weight:600;color:var(--green);padding:6px 0;list-style:none}
.ctx summary::-webkit-details-marker{display:none}
.qbig{font-family:var(--f-head);font-size:20px;font-weight:600;line-height:1.4;margin:6px 0 16px}

/* result */
.result{text-align:center;padding:26px 16px}
.score-ring{width:150px;height:150px;margin:0 auto 12px;position:relative}
.score-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.score-ring .v{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-head)}
.score-ring .v b{font-size:38px;line-height:1}
.score-ring .v span{font-size:13px;color:var(--muted);display:block}
.badge{display:inline-block;padding:4px 14px;border-radius:99px;font-weight:700;font-family:var(--f-head);font-size:15px}
.badge.b2{background:var(--green);color:#fff}
.badge.b1{background:var(--gold-soft);color:#8a5a0c}
.badge.a2{background:var(--bad-soft);color:var(--bad)}
.breakdown{display:grid;gap:8px;margin-top:16px;text-align:left}
.breakdown .ln{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:10px;font-size:14px}
.breakdown .ln .t{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.breakdown .ln .t i{display:block;height:100%;background:var(--green-2)}

/* flashcards */
.fc-wrap{perspective:1200px;margin:6px 0 16px}
.fc{position:relative;height:300px;transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.fc .back{transform:rotateY(180deg);background:#fbf7ee}
.fc .w{font-family:var(--f-head);font-weight:700;font-size:34px;line-height:1.15}
.fc .p{color:var(--muted);font-style:italic;margin-top:4px}
.fc .hint{position:absolute;bottom:14px;font-size:12.5px;color:var(--muted)}
.fc .t{font-size:21px;font-weight:600;margin-bottom:12px}
.fc .ex{font-family:var(--f-read);font-size:16px;color:#36463e}
.fc .unit-tag{position:absolute;top:14px;left:16px;font-size:12px;color:var(--muted)}
.fc .say{position:absolute;top:10px;right:10px}
@media (prefers-reduced-motion:reduce){.fc{transition:none}}

/* textarea */
textarea,input[type=text],input[type=date],select{width:100%;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);color:var(--ink)}
textarea{min-height:220px;resize:vertical;font-family:var(--f-read);line-height:1.6}
textarea:focus,input:focus,select:focus{outline:2px solid var(--green-2);outline-offset:1px;border-color:transparent}
label.lb{display:block;font-weight:600;font-size:14.5px;margin:14px 0 6px}
.wc{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);margin-top:6px}

/* info page */
.table{width:100%;border-collapse:collapse;font-size:15px}
.table th,.table td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.table th{white-space:nowrap;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.table td b{font-family:var(--f-head)}
.timeline{list-style:none;margin:0;padding:0;counter-reset:s}
.timeline li{position:relative;padding:0 0 16px 40px;counter-increment:s}
.timeline li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.timeline li::after{content:"";position:absolute;left:13.5px;top:30px;bottom:2px;width:1px;background:var(--line)}
.timeline li:last-child::after{display:none}
.timeline b{display:block}
.note{font-size:13.5px;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin-top:14px}
.big-compare{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center;margin:6px 0 4px}
.big-compare b{font-family:var(--f-head);font-size:40px;line-height:1;display:block}
.big-compare .from b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px}
.big-compare .to b{color:var(--green)}
.big-compare span{font-size:13px;color:var(--muted)}
.big-compare svg{width:28px;height:28px;color:var(--gold)}

/* plan */
details.plan summary{list-style:none;cursor:pointer}
details.plan summary::-webkit-details-marker{display:none}
.plan-list{margin-top:10px}
.plan-list .pl{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.plan-list .pl .wk{font-family:var(--f-head);font-weight:700;color:var(--green);font-size:13px;line-height:1.2}
.plan-list .pl .wk small{display:block;font-size:20px}
.plan-list .pl b{font-size:15px;display:block}
.plan-list .pl span{font-size:13.5px;color:var(--muted)}
.plan-list .pl.now{background:var(--gold-soft);margin:0 -16px;padding:10px 16px}

/* onboarding */
.onb{padding:28px 4px 0}
.onb h1{font-size:30px;margin:10px 0 8px}
.onb .lead{font-size:16px;color:var(--muted)}
.seg{display:grid;gap:8px}
.seg button{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);min-height:56px}
.seg button.on{border-color:var(--green);background:var(--green-soft)}
.seg button b{font-family:var(--f-head);font-size:18px;width:36px;color:var(--green)}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.empty{text-align:center;padding:36px 12px}
.empty h2{font-size:21px;margin-bottom:6px}
.center{text-align:center}
.mt{margin-top:16px}
.hide{display:none!important}

@media (min-width:600px){
  .app{padding-top:12px}
  .view{padding:8px 20px 0}
}

</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>
  <main id="view" class="view"></main>
</div>

Let me know if you need anything!

Best wishes,

        text: `Three years ago, every classroom in a district in northern Thailand was given a set of tablets. The project was funded by a local technology company, and teachers were trained to use an online learning platform. The aim was to make lessons more interactive and to improve students' digital literacy.

      reading: {
        title: 'Feedback That Works',
        text: `Research consistently shows that feedback is one of the most powerful ways to improve learning, but not all feedback is equally useful. A grade on its own, such as "7/10", tells students how well they did, but not how to do better. If students only receive grades, they tend to compare themselves with classmates rather than focus on their own learning.

The aim of this proposal is to suggest two simple ways to make our homework feedback more effective.

      box.innerHTML = '<div class="small muted" style="text-align:right;margin-top:6px">' + (cur + 1) + ' / ' + q.length + '</div><div class="fc-wrap"><div class="fc" id="card">' +
        '<div class="face front"><span class="unit-tag">Unit ' + v.u + '</span>' + sayBtn(v.w) + '<div class="w">' + esc(v.w) + '</div><div class="p">' + esc(v.p) + '</div><div class="hint">แตะการ์ดเพื่อดูความหมาย</div></div>' +
        '<div class="face back"><span class="unit-tag">Unit ' + v.u + '</span>' + sayBtn(v.ex) + '<div class="bw">' + esc(v.w) + '</div><div class="t">' + esc(v.t) + '</div><div class="ex">' + esc(v.ex) + '</div></div></div></div>' +
        '<div class="btns two"><button class="btn ghost" id="fc-no">ยังไม่จำ</button><button class="btn" id="fc-ok">จำได้</button></div>';
      var card = $('#card');
      card.onclick = function (e) { if (e.target.closest('.say')) return; card.classList.toggle('flip'); };
      $('#fc-no').onclick = function () { S.cards[v.w] = 0; save(); q.push(v); cur++; draw(); };
      $('#fc-ok').onclick = function () { S.cards[v.w] = (S.cards[v.w] || 0) + 1; known++; touch(); cur++; draw(); };
    }
    draw();
  };

  function mockItems() {
    var items = [];
    C.mock.sections.forEach(function (s) {
      s.qs.forEach(function (q, k) {
        var it = Object.assign({}, q, { sec: s.name + ' · ' + s.th, secName: s.name });
        if (s.passage) it.ctx = { type: 'passage', title: 'อ่านบทความแล้วตอบคำถาม', text: s.passage };
        if (s.script) it.ctx = { type: 'script', title: 'ฟังแล้วตอบคำถาม', text: s.script };
        items.push(it);
      });
    });
    return items;
  }

  V.mock = function (el) {
    top();
    var n = mockItems().length;
    var hist = S.mocks.slice(-5).reverse();
    el.innerHTML = '<div class="uhead"><div class="eyebrow">Mock Test</div><h1>ข้อสอบจำลองระดับ B2</h1><p>วัดว่าตอนนี้อยู่ระดับไหน ก่อนสมัครสอบจริง</p></div>' +
      '<div class="card mt"><table class="table"><tr><th>ส่วน</th><th>จำนวน</th></tr>' +
      ['Grammar', 'Vocabulary', 'Reading', 'Listening'].map(function (nm) {
        var c = 0; C.mock.sections.forEach(function (s) { if (s.name === nm) c += s.qs.length; });
        return '<tr><td>' + nm + '</td><td>' + c + ' ข้อ</td></tr>';
      }).join('') + '<tr><td><b>รวม</b></td><td><b>' + n + ' ข้อ · ' + C.mock.minutes + ' นาที</b></td></tr></table>' +
      '<p class="small muted mt" style="margin-bottom:0">ตอบได้ครบแล้วจึงเห็นเฉลย · ส่วน Listening ต้องเปิดเสียง · ผลเป็นการ<b>ประมาณการ</b> ไม่ใช่ผลสอบทางการ</p></div>' +
      '<div class="btns"><button class="btn" id="mk-go">เริ่มสอบ (จับเวลา ' + C.mock.minutes + ' นาที)</button></div>' +
      (hist.length ? '<div class="sec"><h2>ประวัติการสอบ</h2></div><div class="rows">' + hist.map(function (h) {
        var lv = level(h.pct);
        return '<div class="row"><span class="badge ' + lv.c + '">' + h.lvl + '</span><div class="tx"><b>' + h.pct + '%</b><span>' + new Date(h.date).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' }) + '</span></div></div>';
      }).join('') + '</div>' : '');
    $('#mk-go').onclick = function () { go('mockrun'); };
  };

  V.mockrun = function (el) {
    top({ back: function () { go('mock'); }, title: 'ข้อสอบจำลอง' });
    var items = mockItems();
    runner(el, items, {
      feedback: false, minutes: C.mock.minutes,
      onFinish: function (ans) {
        var ok = 0, secs = {};
        items.forEach(function (it, i) {
          var s = secs[it.secName] || (secs[it.secName] = { ok: 0, n: 0 }); s.n++;
          if (ans[i] === it.a) { ok++; s.ok++; }
        });
        var pct = Math.round(ok / items.length * 100), lv = level(pct);
        S.mocks.push({ date: Date.now(), pct: pct, lvl: lv.l }); touch();
        var wrong = items.map(function (it, i) { return { it: it, a: ans[i] }; }).filter(function (x) { return x.a !== x.it.a; });
        top({ back: function () { go('mock'); }, title: 'ผลสอบจำลอง' });
        el.innerHTML = '<div class="result">' + ring(pct) + '<span class="badge ' + lv.c + '">ระดับโดยประมาณ: ' + lv.l + '</span><p class="mt" style="margin-bottom:0">' + lv.t + '</p><p class="small muted">ถูก ' + ok + ' จาก ' + items.length + ' ข้อ</p>' +
          '<div class="card breakdown">' + Object.keys(secs).map(function (k) { var s = secs[k], p = Math.round(s.ok / s.n * 100); return '<div class="ln"><span>' + k + '</span><div class="t"><i style="width:' + p + '%"></i></div><b>' + s.ok + '/' + s.n + '</b></div>'; }).join('') + '</div></div>' +
          (wrong.length ? '<div class="sec"><h2>ทบทวนข้อที่ผิด</h2><span class="small muted">' + wrong.length + ' ข้อ</span></div><div class="card">' + wrong.map(function (x) {
            return '<div class="q"><div class="qt">' + esc(x.it.q) + '</div><div class="small">คำตอบของคุณ: <span style="color:var(--bad)">' + (x.a >= 0 ? esc(x.it.o[x.a]) : '— ไม่ได้ตอบ') + '</span><br>คำตอบที่ถูก: <b style="color:var(--green)">' + esc(x.it.o[x.it.a]) + '</b></div><div class="explain">' + esc(x.it.e) + '</div></div>';
          }).join('') + '</div>' : '') +
          '<div class="btns"><button class="btn" id="mk-again">สอบอีกครั้ง</button><button class="btn ghost" id="mk-home">กลับหน้าหลัก</button></div>';
        $('#mk-again').onclick = function () { go('mockrun'); };
        $('#mk-home').onclick = function () { go('home'); };
        window.scrollTo(0, 0);
      }
    });
  };

  V.info = function (el) {
    top();
    el.innerHTML = '<div class="uhead"><div class="eyebrow">ระเบียบ ก.ค.ศ.</div><h1>ใช้ผล CEFR ลดเวลาวิทยฐานะ</h1><p>สรุปจากหลักเกณฑ์ ว 9/2564 และแนวปฏิบัติ ว 10/2567</p></div>' +
      '<div class="card mt"><div class="big-compare"><div class="from"><b>4 ปี</b><span>ระยะเวลาปกติ</span></div>' + I.arrow + '<div class="to"><b>3 ปี</b><span>เมื่อผ่านเกณฑ์ CEFR</span></div></div>' +
      '<p class="small muted center" style="margin:8px 0 0">ระยะเวลาดำรงตำแหน่ง/วิทยฐานะ ก่อนยื่นขอมีหรือเลื่อนวิทยฐานะ</p></div>' +
      '<div class="sec"><h2>ระดับที่ต้องผ่าน</h2></div><div class="card"><table class="table"><tr><th>ตำแหน่ง / กลุ่มสาระ</th><th>CEFR ขั้นต่ำ</th></tr>' +
      '<tr><td>ครูผู้สอนกลุ่มสาระการเรียนรู้ภาษาต่างประเทศ</td><td><b>B2</b> ขึ้นไป</td></tr>' +
      '<tr><td>ครูกลุ่มสาระอื่น / ผู้บริหารสถานศึกษา / ศึกษานิเทศก์</td><td><b>B1</b> ขึ้นไป</td></tr></table>' +
      '<p class="small" style="margin:12px 0 0"><b>ว 10/2567</b> (3 พ.ค. 2567) ยืนยันว่า ผลสอบที่<b>สูงกว่า</b>ระดับที่กำหนด (เช่น ได้ C1) ก็นำมาใช้ลดระยะเวลาได้</p></div>' +
      '<div class="sec"><h2>B2 เทียบกับข้อสอบสากล</h2><span class="small muted">โดยประมาณ</span></div><div class="card"><table class="table"><tr><th>ข้อสอบ</th><th>คะแนนเทียบ B2</th></tr>' +
      '<tr><td>IELTS</td><td><b>5.5 – 6.0</b></td></tr><tr><td>TOEIC (Listening &amp; Reading)</td><td><b>785 – 940</b></td></tr><tr><td>TOEFL iBT</td><td><b>72 – 94</b></td></tr><tr><td>EF SET</td><td><b>51 – 60</b></td></tr></table>' +
      '<p class="small muted" style="margin:10px 0 0">B2 (Upper-Intermediate) = เข้าใจเนื้อหาซับซ้อนทั้งการฟังและการอ่าน สื่อสารได้คล่องในหลายหัวข้อ และอภิปรายเชิงวิชาชีพ/วิชาการได้</p></div>' +
      '<div class="sec"><h2>ขั้นตอนแนะนำ</h2></div><div class="card"><ol class="timeline">' +
      '<li><b>เรียนตามแผน 12 สัปดาห์</b><span class="small muted">วันละ 20–30 นาที ครบ 8 Unit</span></li>' +
      '<li><b>ทำข้อสอบจำลองให้ได้ ≥ 70%</b><span class="small muted">ทำซ้ำได้จนมั่นใจ</span></li>' +
      '<li><b>สมัครสอบกับหน่วยงาน/ศูนย์สอบที่ ก.ค.ศ. ยอมรับ</b><span class="small muted">ตรวจรายชื่อหน่วยทดสอบล่าสุดก่อนสมัคร</span></li>' +
      '<li><b>เก็บ "ผลการทดสอบ" (Test Report) ฉบับจริง</b><span class="small muted">วุฒิบัตรผ่านการอบรม ใช้แทนผลสอบไม่ได้</span></li>' +
      '<li><b>แนบผลประกอบคำขอวิทยฐานะ</b><span class="small muted">ตรวจสอบอายุของผลสอบ (ส่วนใหญ่กำหนดไม่เกิน 2 ปีนับถึงวันยื่น)</span></li></ol></div>' +
      '<div class="note">ข้อมูลในหน้านี้สรุปเพื่อการเตรียมตัวเท่านั้น หลักเกณฑ์อาจมีการปรับปรุง โปรดตรวจสอบหนังสือเวียนฉบับล่าสุดจากสำนักงาน ก.ค.ศ. หรือเขตพื้นที่การศึกษาของท่านก่อนยื่นคำขอ<br><a href="https://otepc.go.th/th/content_page/item/4911-10-2567-cefr-b2.html" target="_blank" rel="noopener" style="color:var(--green);font-weight:600">เปิดหนังสือ ว 10/2567 (otepc.go.th) ↗</a></div>';
  };

  V.settings = function (el) {
    var p = S.profile;
    top({ back: function () { go('home'); }, title: 'ตั้งค่า' });
    el.innerHTML = '<div class="card"><label class="lb" style="margin-top:0" for="s-name">ชื่อที่ให้เรียก</label><input type="text" id="s-name" value="' + esc(p.name) + '" maxlength="30">' +
      '<label class="lb">เป้าหมาย</label><div class="seg" id="s-grp"><button data-g="lang" class="' + (p.group !== 'other' ? 'on' : '') + '"><b>B2</b><span>ครูภาษาต่างประเทศ</span></button><button data-g="other" class="' + (p.group === 'other' ? 'on' : '') + '"><b>B1</b><span>ครูกลุ่มสาระอื่น / ผู้บริหาร / ศน.</span></button></div>' +
      '<label class="lb" for="s-date">วันสอบจริง</label><input type="date" id="s-date" value="' + esc(p.exam || '') + '">' +
      '<div class="btns"><button class="btn" id="s-save">บันทึก</button></div></div>' +
      '<div class="sec"><h2>ย้ายข้อมูลไปเครื่องอื่น</h2></div><div class="card"><p class="small muted">ความคืบหน้าถูกเก็บในเบราว์เซอร์ของเครื่องนี้ คัดลอกรหัสด้านล่างไปวางในเครื่องใหม่เพื่อเรียนต่อ</p>' +
      '<textarea id="s-code" style="min-height:90px;font-family:ui-monospace,Consolas,monospace;font-size:12px" readonly></textarea>' +
      '<div class="btns two"><button class="btn ghost" id="s-copy">คัดลอกรหัส</button><button class="btn ghost" id="s-imp">นำเข้ารหัส</button></div></div>' +
      '<div class="sec"><h2>รีเซ็ต</h2></div><div class="card"><p class="small muted">ลบความคืบหน้าทั้งหมดและเริ่มใหม่</p><button class="btn ghost" id="s-reset" style="color:var(--bad)">ลบข้อมูลทั้งหมด</button></div>';
    var g = p.group;
    $$('#s-grp button').forEach(function (b) { b.onclick = function () { g = b.dataset.g; $$('#s-grp button').forEach(function (x) { x.classList.toggle('on', x === b); }); }; });
    $('#s-save').onclick = function () { p.name = $('#s-name').value.trim() || p.name; p.group = g; p.exam = $('#s-date').value; save(); toast('บันทึกแล้ว'); go('home'); };
    var code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    $('#s-code').value = code;
    $('#s-copy').onclick = function () {
      var ta = $('#s-code'); ta.select();
      try { if (navigator.clipboard) navigator.clipboard.writeText(code).then(function () { toast('คัดลอกแล้ว'); }, function () { document.execCommand('copy'); toast('คัดลอกแล้ว'); }); else { document.execCommand('copy'); toast('คัดลอกแล้ว'); } } catch (e) { toast('กดค้างที่ช่องเพื่อคัดลอก'); }
    };
    $('#s-imp').onclick = function () {
      var ta = $('#s-code');
      if (ta.readOnly) { ta.readOnly = false; ta.value = ''; ta.placeholder = 'วางรหัสที่นี่ แล้วกด "นำเข้ารหัส" อีกครั้ง'; ta.focus(); return; }
      try { var d = JSON.parse(decodeURIComponent(escape(atob(ta.value.trim())))); if (!d.profile) throw 0; S = Object.assign(blank(), d); save(); toast('นำเข้าสำเร็จ'); go('home'); }
      catch (e) { toast('รหัสไม่ถูกต้อง'); }
    };
    var armed = false;
    $('#s-reset').onclick = function () {
      if (!armed) { armed = true; this.textContent = 'แตะอีกครั้งเพื่อยืนยันการลบ'; return; }
      S = blank(); save(); go('onboard');
    };
  };

  /* ── boot ── */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-say]');
    if (b && !b.id) { e.stopPropagation(); TTS.speak(b.getAttribute('data-say'), b); }
  });
  $$('.nav button').forEach(function (b) { b.onclick = function () { go(b.dataset.tab); }; });
  window.addEventListener('scroll', function () { $('#top').classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });
  render();
})();

</script>
